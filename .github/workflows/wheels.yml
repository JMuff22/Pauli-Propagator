name: Wheels

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  native:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-latest, target: aarch64, manylinux: "2_28" }
          - { os: macos-14, target: aarch64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: native/pprop_rs
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: native/pprop_rs/dist

  sdists:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: native/pprop_rs
          args: --out dist
      - uses: astral-sh/setup-uv@v5
      # Pure-Python wheel + sdist of pauli-propagator.
      - run: uv build --out-dir native/pprop_rs/dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdists
          path: native/pprop_rs/dist

  # Install the built wheels (no Rust toolchain) and run the suite against them.
  test:
    needs: [native, sdists]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Install the freshly built wheels first: the versions match what is
      # already on PyPI, which pip would otherwise happily pick instead.
      - run: "python -m pip install --no-index --no-deps --find-links dist --only-binary :all: pprop-rs pauli-propagator"
      - run: python -m pip install --find-links dist pauli-propagator pytest
      - run: python -m pytest tests/ -q
        env:
          PPROP_REQUIRE_NATIVE: '1'

  # Each package has its own PyPI trusted publisher, and so its own environment.
  # pprop-rs goes first so pauli-propagator is never live without its dependency.
  publish-pprop-rs:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, sdists, test]
    runs-on: ubuntu-latest
    environment: pypi-rs
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: find dist -type f ! -name 'pprop_rs-*' -delete
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-pauli-propagator:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-pprop-rs]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: find dist -type f ! -name 'pauli_propagator-*' -delete
      - uses: pypa/gh-action-pypi-publish@release/v1
